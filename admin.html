<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DijitalRestoranım – Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px}
    body{font-family:'Poppins',sans-serif;background:#0d0d1a;color:#e2e8f0;min-height:100vh}

    /* ── LOGIN ── */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0d0d1a 0%,#1a1a2e 50%,#0f3460 100%)}
    .login-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
      border-radius:24px;padding:48px 40px;width:100%;max-width:420px;
      backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .login-logo{text-align:center;margin-bottom:32px}
    .login-logo .emoji{font-size:3rem;display:block;margin-bottom:10px}
    .login-logo h1{font-size:1.4rem;font-weight:800;color:#fff}
    .login-logo span{font-size:.85rem;color:#6b7280}
    .login-card label{display:block;font-size:.82rem;font-weight:600;color:#9ca3af;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .login-card input{width:100%;padding:13px 16px;background:rgba(255,255,255,.08);
      border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;
      font-family:inherit;font-size:.95rem;margin-bottom:20px;outline:none;transition:.2s}
    .login-card input:focus{border-color:#ff6b35;box-shadow:0 0 0 3px rgba(255,107,53,.2)}
    .login-card input::placeholder{color:#4b5563}
    .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#ff4500,#ff9800);
      color:#fff;border:none;border-radius:50px;font-family:inherit;font-size:1rem;
      font-weight:700;cursor:pointer;transition:.3s}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,53,.4)}
    .login-err{color:#f87171;font-size:.85rem;text-align:center;margin-top:12px;min-height:20px}

    /* ── DASHBOARD ── */
    .dashboard{display:none;min-height:100vh;flex-direction:column}
    .topbar{background:linear-gradient(135deg,#ff4500,#ff9800);padding:0 28px;
      height:64px;display:flex;align-items:center;justify-content:space-between;
      box-shadow:0 4px 20px rgba(255,69,0,.3)}
    .topbar-logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:1.1rem}
    .topbar-right{display:flex;align-items:center;gap:14px}
    .badge-unread{background:rgba(255,255,255,.25);color:#fff;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
    .btn-logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 18px;
      border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:.25s}
    .btn-logout:hover{background:rgba(255,255,255,.3)}

    .main{display:grid;grid-template-columns:300px 1fr;flex:1}

    /* ── SIDEBAR ── */
    .sidebar{background:#111122;border-right:1px solid rgba(255,255,255,.07);
      padding:24px 0;overflow-y:auto;max-height:calc(100vh - 64px)}
    .sidebar-title{padding:0 20px 14px;font-size:.72rem;font-weight:700;
      color:#4b5563;text-transform:uppercase;letter-spacing:.08em}
    .msg-item{padding:16px 20px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);
      transition:.2s;position:relative}
    .msg-item:hover{background:rgba(255,255,255,.04)}
    .msg-item.active{background:rgba(255,107,53,.12);border-left:3px solid #ff6b35}
    .msg-item.unread .msg-name::after{content:'';width:8px;height:8px;background:#ff6b35;
      border-radius:50%;display:inline-block;margin-left:8px;vertical-align:middle}
    .msg-name{font-size:.9rem;font-weight:600;color:#e2e8f0;margin-bottom:4px}
    .msg-preview{font-size:.78rem;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-time{font-size:.72rem;color:#4b5563;margin-top:4px}
    .empty-sidebar{padding:40px 20px;text-align:center;color:#4b5563;font-size:.88rem}

    /* ── STATS BAR ── */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px;
      background:#111122;border-bottom:1px solid rgba(255,255,255,.06)}
    .stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
      border-radius:14px;padding:16px 18px;text-align:center}
    .stat-card .snum{font-size:1.6rem;font-weight:800;color:#ff6b35}
    .stat-card .slabel{font-size:.75rem;color:#6b7280;margin-top:2px}

    /* ── DETAIL PANE ── */
    .detail-pane{background:#0d0d1a;overflow-y:auto;max-height:calc(100vh - 64px)}
    .no-select{display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:#374151;text-align:center;padding:40px}
    .no-select .ns-emoji{font-size:4rem;margin-bottom:16px}
    .no-select p{font-size:1rem;color:#4b5563}

    .detail-header{padding:28px 32px;border-bottom:1px solid rgba(255,255,255,.07);
      display:flex;justify-content:space-between;align-items:flex-start}
    .detail-name{font-size:1.4rem;font-weight:800;color:#fff}
    .detail-date{font-size:.8rem;color:#6b7280;margin-top:4px}
    .detail-actions{display:flex;gap:10px}
    .btn-read{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);
      padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:.25s}
    .btn-read:hover{background:rgba(34,197,94,.25)}
    .btn-del{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3);
      padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:.25s}
    .btn-del:hover{background:rgba(239,68,68,.22)}

    .detail-body{padding:28px 32px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
    .detail-field label{display:block;font-size:.75rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .detail-field .val{font-size:.95rem;color:#e2e8f0;font-weight:500}
    .detail-field .val a{color:#ff6b35;text-decoration:none}
    .detail-field .val a:hover{text-decoration:underline}
    .msg-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
      border-radius:14px;padding:20px 24px}
    .msg-box label{display:block;font-size:.75rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .msg-box p{font-size:.95rem;color:#e2e8f0;line-height:1.7}
    .unread-badge{background:linear-gradient(135deg,#ff6b35,#f7941d);color:#fff;
      font-size:.7rem;padding:3px 9px;border-radius:20px;font-weight:700;margin-left:8px}

    /* ── REFRESH BTN ── */
    .btn-refresh{background:rgba(255,255,255,.08);color:#9ca3af;border:none;padding:8px 16px;
      border-radius:20px;cursor:pointer;font-family:inherit;font-size:.82rem;transition:.25s}
    .btn-refresh:hover{background:rgba(255,255,255,.15);color:#fff}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:28px;right:28px;background:#1f2937;color:#fff;
      padding:14px 22px;border-radius:12px;font-size:.875rem;font-weight:500;
      box-shadow:0 8px 30px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;
      transition:all .3s;z-index:9999}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{border-left:4px solid #22c55e}
    .toast.error{border-left:4px solid #ef4444}

    @media(max-width:768px){
      .main{grid-template-columns:1fr}
      .sidebar{max-height:260px}
      .stats-row{grid-template-columns:1fr 1fr}
      .detail-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- ────────────────── LOGIN ────────────────── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="emoji">🍽️</span>
      <h1>DijitalRestoranım</h1>
      <span>Admin Paneli — Giriş Yap</span>
    </div>
    <label>Şifre</label>
    <input type="password" id="passInput" placeholder="••••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button class="btn-login" onclick="login()">Giriş Yap →</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ────────────────── DASHBOARD ────────────────── -->
<div class="dashboard" id="dashboard">

  <div class="topbar">
    <div class="topbar-logo">
      <span>🍽️</span> DijitalRestoranım Admin
    </div>
    <div class="topbar-right">
      <span class="badge-unread" id="unreadBadge">0 okunmamış</span>
      <button class="btn-refresh" onclick="loadMessages()">🔄 Yenile</button>
      <button class="btn-logout" onclick="logout()">Çıkış</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="snum" id="statTotal">0</div>
      <div class="slabel">Toplam Mesaj</div>
    </div>
    <div class="stat-card">
      <div class="snum" id="statUnread">0</div>
      <div class="slabel">Okunmamış</div>
    </div>
    <div class="stat-card">
      <div class="snum" id="statToday">0</div>
      <div class="slabel">Bugün</div>
    </div>
    <div class="stat-card">
      <div class="snum" id="statRead">0</div>
      <div class="slabel">Okunmuş</div>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title">Gelen Mesajlar</div>
      <div id="msgList"><div class="empty-sidebar">Henüz mesaj yok 📭</div></div>
    </div>

    <!-- Detail -->
    <div class="detail-pane" id="detailPane">
      <div class="no-select">
        <div class="ns-emoji">📨</div>
        <p>Sol taraftan bir mesaj seçin</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:3000/api';
let TOKEN = '';
let messages = [];
let activeId = null;

// ── LOGIN ──────────────────────────────────────────────────────────────────
async function login() {
  const pass = document.getElementById('passInput').value;
  const err  = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const r = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pass })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Hata');
    TOKEN = d.token;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadMessages();
    setInterval(loadMessages, 30000); // 30sn auto-refresh
  } catch(e) {
    err.textContent = '❌ ' + e.message;
  }
}

function logout() {
  TOKEN = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('passInput').value = '';
}

// ── LOAD MESSAGES ─────────────────────────────────────────────────────────
async function loadMessages() {
  try {
    const r = await fetch(`${API}/messages`, {
      headers: { 'x-admin-token': TOKEN }
    });
    if (!r.ok) return;
    messages = await r.json();
    renderSidebar();
    updateStats();
    if (activeId) renderDetail(activeId);
  } catch(e) { console.error(e); }
}

function updateStats() {
  const total   = messages.length;
  const unread  = messages.filter(m => !m.read).length;
  const today   = messages.filter(m => {
    const d = m.date || '';
    return d.includes(new Date().toLocaleDateString('tr-TR').split('.').reverse().join('.').slice(0,5)) ||
           d.startsWith(new Date().toLocaleDateString('tr-TR'));
  }).length;
  document.getElementById('statTotal').textContent  = total;
  document.getElementById('statUnread').textContent  = unread;
  document.getElementById('statToday').textContent   = today;
  document.getElementById('statRead').textContent    = total - unread;
  document.getElementById('unreadBadge').textContent = `${unread} okunmamış`;
}

function renderSidebar() {
  const list = document.getElementById('msgList');
  if (!messages.length) {
    list.innerHTML = '<div class="empty-sidebar">Henüz mesaj yok 📭</div>';
    return;
  }
  list.innerHTML = messages.map(m => `
    <div class="msg-item ${m.read ? '' : 'unread'} ${m.id === activeId ? 'active' : ''}"
         onclick="renderDetail('${m.id}')">
      <div class="msg-name">${esc(m.name)}</div>
      <div class="msg-preview">${esc(m.restaurant || m.message || '—')}</div>
      <div class="msg-time">${esc(m.date)}</div>
    </div>
  `).join('');
}

function renderDetail(id) {
  activeId = id;
  const m = messages.find(x => x.id === id);
  if (!m) return;
  renderSidebar(); // active state

  const pane = document.getElementById('detailPane');
  pane.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${esc(m.name)} ${m.read ? '' : '<span class="unread-badge">YENİ</span>'}</div>
        <div class="detail-date">📅 ${esc(m.date)}</div>
      </div>
      <div class="detail-actions">
        ${!m.read ? `<button class="btn-read" onclick="markRead('${m.id}')">✓ Okundu İşaretle</button>` : ''}
        <button class="btn-del" onclick="deleteMsg('${m.id}')">🗑 Sil</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-grid">
        <div class="detail-field">
          <label>Ad Soyad</label>
          <div class="val">${esc(m.name)}</div>
        </div>
        <div class="detail-field">
          <label>Telefon</label>
          <div class="val"><a href="tel:${esc(m.phone)}">${esc(m.phone)}</a></div>
        </div>
        <div class="detail-field">
          <label>Restoran Adı</label>
          <div class="val">${esc(m.restaurant || '—')}</div>
        </div>
        <div class="detail-field">
          <label>Tarih</label>
          <div class="val">${esc(m.date)}</div>
        </div>
      </div>
      <div class="msg-box">
        <label>Mesaj</label>
        <p>${esc(m.message || 'Mesaj girilmemiş.')}</p>
      </div>
    </div>
  `;

  if (!m.read) markRead(id);
}

async function markRead(id) {
  await fetch(`${API}/messages/${id}/read`, {
    method: 'PATCH',
    headers: { 'x-admin-token': TOKEN }
  });
  const msg = messages.find(m => m.id === id);
  if (msg) msg.read = true;
  renderSidebar();
  updateStats();
  if (activeId === id) renderDetail(id);
  showToast('Okundu olarak işaretlendi ✓', 'success');
}

async function deleteMsg(id) {
  if (!confirm('Bu mesajı silmek istiyor musunuz?')) return;
  await fetch(`${API}/messages/${id}`, {
    method: 'DELETE',
    headers: { 'x-admin-token': TOKEN }
  });
  messages = messages.filter(m => m.id !== id);
  if (activeId === id) {
    activeId = null;
    document.getElementById('detailPane').innerHTML = `
      <div class="no-select">
        <div class="ns-emoji">📨</div>
        <p>Sol taraftan bir mesaj seçin</p>
      </div>`;
  }
  renderSidebar();
  updateStats();
  showToast('Mesaj silindi 🗑', 'error');
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('passInput').focus();
</script>
</body>
</html>
